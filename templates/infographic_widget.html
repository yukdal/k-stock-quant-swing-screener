<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Market Infographic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
            background-color: #0b0f19; /* Deeper space dark */
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 1200px;
            min-height: 700px; /* Let it expand naturally if content is longer */
        }

        /* 카드가 4개 이상(미국판)이면 캔버스 자체를 넓혀 카드가 찌그러지지 않게 한다 */
        body.wide {
            width: 1640px;
        }

        /* Beautiful Mesh Gradient + Glassmorphism Container */
        .widget-container {
            width: 100%;
            min-height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
                        linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            color: #94A3B8;
            font-weight: 500;
        }

        .cards-container {
            display: flex;
            gap: 24px;
            flex: 1;
            z-index: 2;
        }

        /* Glassmorphism Cards */
        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
        }

        .card.kospi::before { background: linear-gradient(90deg, #3B82F6, #60A5FA); }
        .card.kosdaq::before { background: linear-gradient(90deg, #10B981, #34D399); }
        .card.sp500::before { background: linear-gradient(90deg, #8B5CF6, #A78BFA); }
        .card.nasdaq100::before { background: linear-gradient(90deg, #0EA5E9, #38BDF8); }
        .card.tqqq::before { background: linear-gradient(90deg, #F43F5E, #FB7185); }
        .card.qld::before { background: linear-gradient(90deg, #F59E0B, #FBBF24); }

        /* 카드가 4개 이상(미국판)일 때는 폭이 좁아지므로 여백과 글자 크기를 줄인다 */
        .cards-container.dense { gap: 18px; }
        .cards-container.dense .card { padding: 22px; }
        .cards-container.dense .card-header { font-size: 19px; margin-bottom: 18px; }
        .cards-container.dense .price { font-size: 36px; }
        .cards-container.dense .change { font-size: 16px; padding: 5px 12px; }
        .cards-container.dense .local-high { font-size: 13px; }
        .cards-container.dense .comment-box { font-size: 13.5px; padding: 14px 16px; }
        .cards-container.dense .watermark { font-size: 110px; }

        /* 미국 종목 기준일(전일 종가) 배지 */
        .as-of {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: #FCD34D;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.18);
        }

        .watermark {
            position: absolute;
            right: -10px;
            top: 30%;
            font-size: 140px;
            opacity: 0.03;
            pointer-events: none;
            line-height: 1;
            font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
        }

        .card-header {
            font-size: 22px;
            font-weight: 800;
            color: #F1F5F9;
            margin-bottom: 24px;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .price-container {
            z-index: 1;
            margin-bottom: 16px;
        }

        .price {
            font-size: 46px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .change {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            display: inline-flex;
            white-space: nowrap;
        }

        /* Pastel Soft Colors for friendly look */
        .up { 
            color: #FF6B6B; 
            background: rgba(255, 107, 107, 0.1);
        } 
        .down { 
            color: #4DABF7; 
            background: rgba(77, 171, 247, 0.1);
        } 
        .neutral { 
            color: #94A3B8; 
            background: rgba(148, 163, 184, 0.1);
        }

        .local-high {
            font-size: 15px;
            font-weight: 500;
            color: #CBD5E1;
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* Speech Bubble Style Comment */
        .comment-box {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 16px 20px;
            border-radius: 16px;
            border-top-left-radius: 4px; /* Makes it look like a speech bubble */
            font-size: 15px;
            color: #E2E8F0;
            line-height: 1.6;
            z-index: 1;
            word-break: keep-all;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .macro-banner {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .macro-icon {
            font-size: 32px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(245, 158, 11, 0.3));
        }

        .macro-text {
            flex: 1;
        }

        .macro-title {
            font-size: 14px;
            color: #93C5FD;
            font-weight: 800;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .macro-content {
            font-size: 17px;
            color: #F8FAFC;
            font-weight: 500;
            line-height: 1.5;
            word-break: keep-all;
        }
    </style>
</head>
<body class="{% if cards|length > 3 %}wide{% endif %}">
    <div class="widget-container">
        <div class="header">
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
        </div>

        <div class="cards-container {% if cards|length > 3 %}dense{% endif %}">
            {% for c in cards %}
            <div class="card {{ c.slug }}">
                <div class="watermark">{{ c.flag }}</div>
                <div class="card-header">{{ c.flag }} {{ c.name }}</div>
                <div class="price-container">
                    <div class="price">{{ c.close }}</div>
                    <div class="change {{ c.color }}">
                        {{ c.change }}
                    </div>
                    <div class="local-high">
                        🎯 직전 고점 대비 <strong>{{ c.lh }}</strong>
                    </div>
                    {% if c.as_of %}
                    <div class="as-of">📅 {{ c.as_of }} 종가 기준</div>
                    {% endif %}
                </div>
                <div class="comment-box">
                    🤖 <strong>AI 진단:</strong><br>{{ c.comment }}
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="macro-banner">
            <div class="macro-icon">💡</div>
            <div class="macro-text">
                <div class="macro-title">수석 애널리스트 AI 매크로 한줄평</div>
                <div class="macro-content">{{ macro_comment }}</div>
            </div>
        </div>
    </div>
</body>
</html>
