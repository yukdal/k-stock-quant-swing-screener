name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 문법 검사 및 로직 테스트
    runs-on: ubuntu-latest
    # 서버(OCI)와 동일한 Python 3.11 기준으로 검증합니다.
    # zoneinfo(표준 라이브러리)를 사용하므로 3.9 미만에서는 동작하지 않습니다.
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # 브라우저 바이너리(playwright install)는 받지 않습니다.
        # CI 테스트는 Jinja 렌더링까지만 검증하고 스크린샷은 찍지 않습니다.

      - name: 전체 파일 문법 검사
        # temp_index_closing.py는 index_closing.py의 옛 복사본으로 어디서도 임포트되지
        # 않으며, UTF-16으로 저장되어 있어 컴파일이 불가능하므로 검사에서 제외합니다.
        # (정리하려면 파일을 삭제하고 아래 -x 옵션을 지우면 됩니다)
        run: python -m compileall -q -x 'temp_index_closing\.py' .

      - name: 모듈 임포트 검증
        # 순환 임포트나 오타를 조기에 잡습니다. 임포트만으로 네트워크 호출이
        # 발생하면 안 되므로, 여기서 걸리면 모듈 초기화 코드에 문제가 있는 것입니다.
        run: |
          python -c "import config, notifier, chat_manager, index_closing, infographic_generator, swing_main; print('모든 모듈 임포트 정상')"

      - name: 레버리지 ETF 알림 로직 테스트
        # TQQQ/QLD 분할매수 티어 계산, 중복 발송 방지, 미국장 개장 판정(ET 기준)
        run: python test_leverage_alerts.py

      - name: 리포트 및 인포그래픽 렌더링 테스트
        # 15:45 텍스트 리포트 조립, 카드 컨텍스트, Jinja 템플릿 렌더링
        run: python test_report_render.py
